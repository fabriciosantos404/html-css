<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>

    <style>
        div.quadrado 
        {
            display: inline-block;
            background-color: lightskyblue;
            border: 1px solid black;
            text-align: center;
            height: 200px;
            width: 200px;
        }

        div:hover
        {
            background-color: rgb(248, 160, 160);
        }

    </style>
</head>

<body>
    <div class="quadrado" id="d1">01</div>
    <div class="quadrado" id="d2">02</div>
    <div class="quadrado" id="d3">03</div>
</body>

</html>
