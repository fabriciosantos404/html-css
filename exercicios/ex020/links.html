<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body
        {
            font-family: Arial, Helvetica, sans-serif;
        }

        a
        {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited
        {
            color: darkred;
        }

        a:hover
        {
            color: black;
            text-decoration: underline;
        }

        a:active
        {
            color: yellow;
        }

        .especial
        {
            background-color: rgb(247, 208, 228);
        }

        a::after
        {
            content: ' [link]';
            text-decoration: none;
            font-weight: normal;
            color: darkgray;
        }
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/fabriciosantos404" class="especial" target="_blank">Repositório GitHub</a></li>
        <li><a href="https://www.youtube.com/@FabricioSantos-x4w" target="_blank">Canal do YouTube</a></li>
        <li><a href="https://www.cursoemvideo.com/meus-cursos/" target="_blank">Site</a></li>
    </ul>
</body>
</html>
