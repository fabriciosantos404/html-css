<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'London';
            src: url('fonts/OldLondon.ttf') format(truetype), url(fonts/Olondon_.otf) format(opentype);
            font-weight: normal;
            font-style: normal;
        }
        body 
        {
            font-family: Arial, Helvetica, sans-serif;
        }
    
        h1 
        {
            font-family: 'London', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Fairy Tea!</h1>
    <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Placeat officiis quis natus debitis, expedita non magnam modi temporibus, quod reiciendis vero. Deleniti doloribus minus voluptate veritatis vitae! Sequi, modi eligendi!</p>
</body>
</html>
