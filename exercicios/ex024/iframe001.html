<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid gray;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>

    <!-- Tamanho padrão 300x150 -->

    <p>
        Acessando o site 
        
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" width="500" scrolling="auto">do <a href="https://www.cursoemvideo.com" target="_blank"></a></iframe>
        
        para aprender a programar.</p>

        <p>O site 
            <iframe src="https://www.google.com.br" frameborder="0">
                do <a href="https://www.google.com.br" target="_blank"></a>

            </iframe> bloqueia o iframe.
        </p>
</body>
</html>
