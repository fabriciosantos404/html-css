<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
            position: relative;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        caption {
            font-size: 1.5em;
            font-weight: bold;
            padding: 10px;
            background-color: lightgray;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }

        thead > tr > th {
            position: sticky;
            top: -1px;
            background-color: gray;
        }

        tbody > tr:nth-child(2n) {
            background-color: lightgray;
        }

    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            CAPTION
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->
    <table>
        <caption>Jogadores</caption>
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Classe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mael</td>
                <td>Paladino</td>
            </tr>
            <tr>
                <td>Mainü</td>
                <td>Monge</td>
            </tr>
            <tr>
                <td>Golendriel</td>
                <td>Feiticeiro</td>
            </tr>
            <tr>
                <td>Bjorn</td>
                <td>Bárbaro</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row">XP Total</th>
            <td class="num">08 / <strong>10</strong></td>
        </tfoot>
    </table>
</body>
</html>
