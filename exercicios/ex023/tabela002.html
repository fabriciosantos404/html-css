<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }

        thead, tfoot {
            background-color: gray;
            color: white;
        }

    </style>
</head>
<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->
    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Classe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Mael</td>
                <td>Paladino</td>
            </tr>
            <tr>
                <td>Mainü</td>
                <td>Monge</td>
            </tr>
            <tr>
                <td>Golendriel</td>
                <td>Feiticeiro</td>
            </tr>
        </tbody>
        <tfoot>
            <th>XP Total</th>
            <td>08 / 10</td>
        </tfoot>
    </table>
</body>
</html>
